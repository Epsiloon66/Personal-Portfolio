<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="32" height="32" fill="#04040e"/>

  <!-- Space Invader pixel art — 2px/pixel, 11x8 sprite, centered -->

  <!-- Row 0: cols 2, 8 -->
  <rect x="9"  y="8"  width="2" height="2" fill="#00ff41"/>
  <rect x="21" y="8"  width="2" height="2" fill="#00ff41"/>

  <!-- Row 1: cols 3, 7 -->
  <rect x="11" y="10" width="2" height="2" fill="#00ff41"/>
  <rect x="19" y="10" width="2" height="2" fill="#00ff41"/>

  <!-- Row 2: cols 2-8 -->
  <rect x="9"  y="12" width="14" height="2" fill="#00ff41"/>

  <!-- Row 3: cols 1-2, 4-6, 8-9 -->
  <rect x="7"  y="14" width="4"  height="2" fill="#00ff41"/>
  <rect x="13" y="14" width="6"  height="2" fill="#00ff41"/>
  <rect x="21" y="14" width="4"  height="2" fill="#00ff41"/>

  <!-- Row 4: cols 0-10 -->
  <rect x="5"  y="16" width="22" height="2" fill="#00ff41"/>

  <!-- Row 5: cols 0, 2-8, 10 -->
  <rect x="5"  y="18" width="2"  height="2" fill="#00ff41"/>
  <rect x="9"  y="18" width="14" height="2" fill="#00ff41"/>
  <rect x="25" y="18" width="2"  height="2" fill="#00ff41"/>

  <!-- Row 6: cols 0, 2, 8, 10 -->
  <rect x="5"  y="20" width="2"  height="2" fill="#00ff41"/>
  <rect x="9"  y="20" width="2"  height="2" fill="#00ff41"/>
  <rect x="21" y="20" width="2"  height="2" fill="#00ff41"/>
  <rect x="25" y="20" width="2"  height="2" fill="#00ff41"/>

  <!-- Row 7: cols 3-4, 6-7 -->
  <rect x="11" y="22" width="4"  height="2" fill="#00ff41"/>
  <rect x="17" y="22" width="4"  height="2" fill="#00ff41"/>
</svg>
