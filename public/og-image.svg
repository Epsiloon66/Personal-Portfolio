<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="1200" height="630" fill="#04040e"/>

  <!-- Green border -->
  <rect x="0"  y="0"  width="1200" height="6"   fill="#00ff41"/>
  <rect x="0"  y="624" width="1200" height="6"  fill="#00ff41"/>
  <rect x="0"  y="0"  width="6"    height="630" fill="#00ff41"/>
  <rect x="1194" y="0" width="6"   height="630" fill="#00ff41"/>

  <!-- Corner accents -->
  <rect x="20" y="20" width="40" height="4"  fill="#00ff41" opacity="0.5"/>
  <rect x="20" y="20" width="4"  height="40" fill="#00ff41" opacity="0.5"/>
  <rect x="1140" y="20" width="40" height="4"  fill="#00ff41" opacity="0.5"/>
  <rect x="1176" y="20" width="4"  height="40" fill="#00ff41" opacity="0.5"/>
  <rect x="20" y="606" width="40" height="4"  fill="#00ff41" opacity="0.5"/>
  <rect x="20" y="570" width="4"  height="40" fill="#00ff41" opacity="0.5"/>
  <rect x="1140" y="606" width="40" height="4"  fill="#00ff41" opacity="0.5"/>
  <rect x="1176" y="570" width="4" height="40" fill="#00ff41" opacity="0.5"/>

  <!-- Stars (decorative dots) -->
  <rect x="100" y="80"  width="3" height="3" fill="white" opacity="0.5"/>
  <rect x="350" y="50"  width="2" height="2" fill="white" opacity="0.4"/>
  <rect x="600" y="90"  width="3" height="3" fill="white" opacity="0.6"/>
  <rect x="850" y="60"  width="2" height="2" fill="white" opacity="0.3"/>
  <rect x="1050" y="100" width="3" height="3" fill="white" opacity="0.5"/>
  <rect x="200" y="500" width="2" height="2" fill="white" opacity="0.4"/>
  <rect x="750" y="540" width="3" height="3" fill="white" opacity="0.5"/>
  <rect x="1000" y="520" width="2" height="2" fill="white" opacity="0.3"/>
  <rect x="450" y="560" width="3" height="3" fill="white" opacity="0.4"/>

  <!-- Invader left (scale 5, INVADER_A) -->
  <g transform="translate(80, 200)" fill="#00ff41" opacity="0.35">
    <rect x="10" y="0"  width="5" height="5"/>
    <rect x="40" y="0"  width="5" height="5"/>
    <rect x="15" y="5"  width="5" height="5"/>
    <rect x="35" y="5"  width="5" height="5"/>
    <rect x="10" y="10" width="35" height="5"/>
    <rect x="5"  y="15" width="10" height="5"/>
    <rect x="20" y="15" width="15" height="5"/>
    <rect x="40" y="15" width="10" height="5"/>
    <rect x="0"  y="20" width="55" height="5"/>
    <rect x="0"  y="25" width="5"  height="5"/>
    <rect x="10" y="25" width="35" height="5"/>
    <rect x="50" y="25" width="5"  height="5"/>
    <rect x="0"  y="30" width="5"  height="5"/>
    <rect x="10" y="30" width="5"  height="5"/>
    <rect x="40" y="30" width="5"  height="5"/>
    <rect x="50" y="30" width="5"  height="5"/>
    <rect x="15" y="35" width="10" height="5"/>
    <rect x="30" y="35" width="10" height="5"/>
  </g>

  <!-- Invader right (scale 5, INVADER_B) -->
  <g transform="translate(1000, 180)" fill="#00b4d8" opacity="0.35">
    <rect x="5"  y="0"  width="5" height="5"/>
    <rect x="45" y="0"  width="5" height="5"/>
    <rect x="10" y="5"  width="5" height="5"/>
    <rect x="40" y="5"  width="5" height="5"/>
    <rect x="5"  y="10" width="45" height="5"/>
    <rect x="0"  y="15" width="10" height="5"/>
    <rect x="20" y="15" width="15" height="5"/>
    <rect x="45" y="15" width="10" height="5"/>
    <rect x="0"  y="20" width="55" height="5"/>
    <rect x="5"  y="25" width="45" height="5"/>
    <rect x="5"  y="30" width="5"  height="5"/>
    <rect x="45" y="30" width="5"  height="5"/>
    <rect x="10" y="35" width="5"  height="5"/>
    <rect x="40" y="35" width="5"  height="5"/>
  </g>

  <!-- Small invader top right decoration -->
  <g transform="translate(520, 120)" fill="#ffbe0b" opacity="0.25">
    <rect x="4" y="0"  width="2" height="2"/>
    <rect x="8" y="0"  width="2" height="2"/>
    <rect x="2" y="2"  width="12" height="2"/>
    <rect x="0" y="4"  width="16" height="2"/>
    <rect x="2" y="6"  width="4"  height="2"/>
    <rect x="10" y="6" width="4"  height="2"/>
    <rect x="4" y="8"  width="4"  height="2"/>
    <rect x="8" y="8"  width="4"  height="2"/>
  </g>

  <!-- Tag line -->
  <text
    x="600" y="220"
    font-family="monospace" font-size="18"
    fill="#00ff41" opacity="0.6"
    text-anchor="middle" letter-spacing="8">
    // PORTFOLIO PERSONAL
  </text>

  <!-- Main title -->
  <text
    x="600" y="330"
    font-family="monospace" font-size="72" font-weight="bold"
    fill="#00ff41"
    text-anchor="middle" letter-spacing="6"
    style="text-shadow: 0 0 20px #00ff41">
    GUILLERMO JIMÉNEZ
  </text>

  <!-- Subtitle -->
  <text
    x="600" y="400"
    font-family="monospace" font-size="24"
    fill="#ffbe0b"
    text-anchor="middle" letter-spacing="10">
    DESARROLLADOR MULTIPLATAFORMAS
  </text>

  <!-- Divider line -->
  <rect x="300" y="430" width="600" height="2" fill="#00ff41" opacity="0.3"/>

  <!-- URL -->
  <text
    x="600" y="480"
    font-family="monospace" font-size="18"
    fill="#00ff41" opacity="0.5"
    text-anchor="middle" letter-spacing="4">
    guillejm.vercel.app
  </text>

  <!-- Press start prompt -->
  <text
    x="600" y="560"
    font-family="monospace" font-size="14"
    fill="white" opacity="0.25"
    text-anchor="middle" letter-spacing="6">
    ▶ PRESS START
  </text>
</svg>
