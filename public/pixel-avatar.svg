<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 114" width="288" height="228" shape-rendering="crispEdges">
  <!-- MONITOR frame -->
  <rect x="6"  y="0"  width="48" height="6"  fill="#0a0a18"/>
  <rect x="6"  y="6"  width="6"  height="30" fill="#1a1a30"/>
  <rect x="48" y="6"  width="6"  height="30" fill="#1a1a30"/>
  <rect x="6"  y="36" width="48" height="6"  fill="#1a1a30"/>
  <!-- SCREEN -->
  <rect x="12" y="6"  width="36" height="30" fill="#0d1f0d"/>
  <!-- Code lines on screen -->
  <rect x="14" y="10" width="18" height="2"  fill="#00e838"/>
  <rect x="14" y="15" width="12" height="2"  fill="#00e838"/>
  <rect x="18" y="20" width="20" height="2"  fill="#00e838"/>
  <rect x="18" y="25" width="8"  height="2"  fill="#00e838"/>
  <rect x="14" y="30" width="14" height="2"  fill="#00e838"/>
  <!-- Cursor blink -->
  <rect x="34" y="30" width="4"  height="4"  fill="#00ff41">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- MONITOR STAND -->
  <rect x="24" y="42" width="6"  height="6"  fill="#1a1a30"/>
  <rect x="18" y="48" width="18" height="4"  fill="#1a1a30"/>

  <!-- KEYBOARD -->
  <rect x="6"  y="48" width="18" height="4"  fill="#1e1e1e"/>
  <rect x="6"  y="50" width="18" height="2"  fill="#282828"/>

  <!-- DESK surface -->
  <rect x="0"  y="52" width="78" height="5"  fill="#3a2510"/>
  <rect x="0"  y="57" width="78" height="4"  fill="#2a1a0a"/>

  <!-- HAIR (profile facing left) -->
  <rect x="90" y="0"  width="24" height="6"  fill="#1a0a04"/>
  <rect x="84" y="6"  width="6"  height="6"  fill="#1a0a04"/>
  <rect x="90" y="6"  width="18" height="6"  fill="#3c1e0c"/>
  <rect x="84" y="12" width="6"  height="6"  fill="#1a0a04"/>
  <rect x="90" y="12" width="12" height="6"  fill="#3c1e0c"/>
  <rect x="102" y="12" width="6" height="6"  fill="#1a0a04"/>

  <!-- FACE (profile) -->
  <rect x="90" y="18" width="12" height="6"  fill="#f0c49a"/>
  <rect x="96" y="18" width="6"  height="6"  fill="#583010"/>  <!-- eye -->
  <rect x="84" y="18" width="6"  height="6"  fill="#1a0a04"/>  <!-- hair framing face -->
  <rect x="90" y="24" width="12" height="6"  fill="#f0c49a"/>
  <rect x="90" y="30" width="6"  height="4"  fill="#f0c49a"/>  <!-- chin/neck -->

  <!-- NECK + COLLAR -->
  <rect x="90" y="34" width="18" height="4"  fill="#1a2e50"/>

  <!-- ARM reaching to keyboard (navy sweater) -->
  <rect x="36" y="38" width="72" height="6"  fill="#1a2e50"/>
  <!-- Hand over keyboard (skin) -->
  <rect x="18" y="38" width="18" height="6"  fill="#f0c49a"/>

  <!-- BODY (torso) -->
  <rect x="90" y="44" width="18" height="8"  fill="#1a2e50"/>

  <!-- LAP / lower body -->
  <rect x="72" y="61" width="30" height="6"  fill="#1a2e50"/>
  <rect x="66" y="67" width="30" height="6"  fill="#1a2e50"/>

  <!-- CHAIR SEAT -->
  <rect x="54" y="67" width="12" height="18" fill="#2a2a2a"/>   <!-- left armrest -->
  <rect x="96" y="61" width="12" height="18" fill="#2a2a2a"/>   <!-- right armrest -->

  <!-- CHAIR BACK -->
  <rect x="108" y="34" width="8"  height="54" fill="#222222"/>

  <!-- LEGS (hanging down, profile) -->
  <rect x="72" y="73" width="12" height="18" fill="#1a2e50"/>   <!-- front leg -->
  <rect x="84" y="73" width="12" height="18" fill="#162848"/>   <!-- back leg (slightly darker) -->

  <!-- SHOES -->
  <rect x="60" y="91" width="24" height="6"  fill="#111111"/>
  <rect x="78" y="91" width="18" height="6"  fill="#0c0c0c"/>

  <!-- CHAIR LEGS -->
  <rect x="54" y="85" width="6"  height="24" fill="#333333"/>
  <rect x="102" y="85" width="6" height="24" fill="#333333"/>

  <!-- FLOOR LINE -->
  <rect x="0"  y="108" width="144" height="6" fill="#0a0a14"/>

  <!-- Ambient glow from screen on face -->
  <rect x="84" y="12" width="6"  height="24" fill="#00ff41" opacity="0.04"/>
</svg>
